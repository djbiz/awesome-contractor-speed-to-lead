<!doctype html>
<!-- Sticky tap-to-call for contractor sites. No JS, no tracking.
     Drop just before </body>. Adjust --bar-h to your header height if you have a fixed header. -->
<style>
  .wr-callbar{position:fixed;left:0;right:0;bottom:0;z-index:9999;
    background:#b91c1c;color:#fff;text-align:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    font:600 17px/1.2 system-ui,sans-serif;text-decoration:none;display:block}
  .wr-callbar:focus-visible{outline:3px solid #fff;outline-offset:-3px}
  @media(min-width:768px){.wr-callbar{display:none}}
  @media(prefers-reduced-motion:no-preference){.wr-callbar:active{transform:scale(.98)}}
</style>
<a class="wr-callbar" href="tel:+13305550100">Call now: (330) 555-0100</a>
